# JVM settings for the Gradle daemon. 4g is comfortable on a GitHub Actions
# ubuntu-latest runner (7 GB RAM) and leaves headroom for the Kotlin compiler.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Build speed
org.gradle.parallel=true
org.gradle.caching=true
# Left OFF deliberately: KSP/Room + configuration cache is the most common cause
# of a red CI run on a machine you cannot debug locally. Turn it on later if you
# want faster builds.
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Keep bundled Bible JSON uncompressed in the APK is NOT wanted - we ship .gz
# ourselves, so let aapt2 compress everything else normally.
